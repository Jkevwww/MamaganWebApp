services:
  app:
    build: .
    container_name: mamagan-webapp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads

  db:
    image: mysql:8.4
    container_name: mamagan-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mamagan_root_password}
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build: .
    profiles:
      - tools
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

  seed:
    build: .
    profiles:
      - tools
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]

volumes:
  mysql_data:
  uploads:
