<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html">My Bookings</a>
      <a href="#" id="navUser" aria-label="User profile" class="text-muted nav-user"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm">Logout</button>
    </nav>
  </header>

  <main class="page-content">
    <div class="container">
      <header class="page-header">
        <h1 class="page-title">My bookings</h1>
        <p class="page-subtitle">View payment status, visit times, and tickets for your Mamagan reservations.</p>
      </header>

      <div class="table-card">
        <div class="table-responsive">
          <table class="data-table" id="myBookingsTable">
            <thead>
              <tr>
                <th>Facility</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="myBookingsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/skeleton.js"></script>
  <script src="/js/bookings.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
