<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilities - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html" class="auth-only">My Bookings</a>
      <a href="#" id="navUser" aria-label="User profile" class="text-muted nav-user nav-user--compact"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm auth-only is-hidden">Logout</button>
      <a href="/login.html" class="btn btn-primary btn-sm guest-only">Login</a>
    </nav>
  </header>

  <main class="page-content">
    <div class="container">
      <header class="page-header">
        <h1 class="page-title">Our Facilities</h1>
        <p class="page-subtitle">Filter by category, capacity, and budget. Book your beach adventure in a few clicks.</p>
      </header>
      <div class="alert alert-error" id="pageAlert"></div>

      <div class="filters-layout">
        <aside class="filters-panel" aria-label="Search filters">
          <h3><i class="filters-title-icon" data-lucide="filter" aria-hidden="true"></i> Filters</h3>

          <div class="filter-group">
            <label for="filterCategory">Category</label>
            <select id="filterCategory" class="form-select">
              <option value="">All Categories</option>
              <option value="COTTAGE">Cottages</option>
              <option value="CABANA">Rooms / Cabanas</option>
              <option value="BEACH_EQUIPMENT">Beach Equipment</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterCapacity">Minimum capacity</label>
            <input class="form-control" type="number" id="filterCapacity" placeholder="Guests" min="1">
          </div>

          <div class="filter-group">
            <label>Price range (₱)</label>
            <div class="form-grid-2">
              <input class="form-control" type="number" id="filterMinPrice" placeholder="Min" min="0">
              <input class="form-control" type="number" id="filterMaxPrice" placeholder="Max" min="0">
            </div>
          </div>

          <button type="button" id="applyFilters" class="btn btn-primary btn-block">Apply filters</button>
          <button type="button" id="resetFilters" class="btn btn-outline btn-block filter-reset-button">Reset</button>
        </aside>

        <div class="filters-main">
          <div class="facilities-toolbar">
            <h2 class="page-title browse-heading">Browse</h2>
            <div class="search-field">
              <i data-lucide="search" aria-hidden="true"></i>
              <input type="search" id="searchInput" placeholder="Search facilities..." autocomplete="off">
            </div>
          </div>

          <div class="facility-grid" id="facilityGrid" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/skeleton.js"></script>
  <script src="/js/facilities.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
