<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mamagan Booking - Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Mamagan Fun & Adventure Beach Resort</h1>
    <p class="subtitle">Login to continue booking and payment.</p>

    <section class="card">
      <h2>Continue with</h2>
      <div class="buttons">
        <a class="btn btn-google" href="/auth/google">Continue with Google</a>
        <a class="btn btn-github" href="/auth/github">Continue with GitHub</a>
      </div>
    </section>

    <section class="card" aria-live="polite">
      <h2>Account status</h2>
      <pre id="me">Loading...</pre>
      <a id="logoutBtn" class="btn btn-ghost" href="/auth/logout" style="display:none;">Logout</a>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
