<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Facility - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html">My Bookings</a>
      <a href="#" id="navUser" class="text-muted" style="opacity:0.85;cursor:default;max-width:180px;overflow:hidden;text-overflow:ellipsis;"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm">Logout</button>
    </nav>
  </header>

  <main class="page-content">
    <div class="container narrow-container">
      <a href="/facilities.html" class="link-back">
        <i data-lucide="arrow-left" style="width: 16px;" aria-hidden="true"></i> Back to Facilities
      </a>

      <div id="bookingContent" class="booking-layout">
        <div class="booking-main">
          <div id="facilityHeader" style="margin-bottom: 1.5rem;">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-image" style="height:100px;border-radius:10px;margin-top:1rem;"></div>
          </div>

          <form id="bookingForm" style="display: none;">
            <div class="form-group">
              <label for="bookDate"><i data-lucide="calendar" style="width:14px;margin-right:5px;" aria-hidden="true"></i> Reservation date</label>
              <input class="form-control" type="date" id="bookDate" required>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="startTime"><i data-lucide="clock" style="width:14px;margin-right:5px;" aria-hidden="true"></i> Start time</label>
                <input class="form-control" type="time" id="startTime" required>
              </div>
              <div class="form-group">
                <label for="endTime"><i data-lucide="clock" style="width:14px;margin-right:5px;" aria-hidden="true"></i> End time</label>
                <input class="form-control" type="time" id="endTime" required>
              </div>
            </div>

            <div id="bookingTypeGroup" class="form-group" style="display: none;">
              <label><i data-lucide="sun-moon" style="width:14px;margin-right:5px;" aria-hidden="true"></i> Booking type</label>
              <div class="checkbox-row" style="margin-top:0.35rem;">
                <label><input type="radio" name="bookingType" value="DAY" checked> Day</label>
                <label><input type="radio" name="bookingType" value="NIGHT"> Night</label>
              </div>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="quantity"><i data-lucide="hash" style="width:14px;margin-right:5px;" aria-hidden="true"></i> Quantity</label>
                <input class="form-control" type="number" id="quantity" value="1" min="1" required>
              </div>
              <div class="form-group">
                <label for="guestCount"><i data-lucide="users" style="width:14px;margin-right:5px;" aria-hidden="true"></i> Guest count</label>
                <input class="form-control" type="number" id="guestCount" value="1" min="1" required>
              </div>
            </div>

            <div class="form-group">
              <label for="notes"><i data-lucide="message-square" style="width:14px;margin-right:5px;" aria-hidden="true"></i> Notes / special requests</label>
              <textarea class="form-textarea" id="notes" rows="3"></textarea>
            </div>

            <div id="availabilityStatus" role="status" aria-live="polite" style="display: none;"></div>
          </form>
        </div>

        <aside class="booking-summary" aria-label="Booking summary">
          <h3 class="page-title" style="font-size:1.15rem;margin-bottom:1rem;">Booking summary</h3>
          <div id="summaryDetails">
             <p class="text-muted">Fill in the details to see the total amount.</p>
          </div>
          <hr class="summary-divider">
          <div class="summary-total-row">
            <span>Total amount</span>
            <span id="totalAmount">₱0.00</span>
          </div>
          <button type="button" id="submitBooking" class="btn btn-primary btn-block btn-large" disabled>Confirm reservation</button>
          <p class="input-hint" style="text-align:center;margin-top:1rem;">You will have 15 minutes to complete payment after confirmation.</p>
        </aside>
      </div>
    </div>
  </main>

  <div id="errorOverlay" class="error-overlay" role="alertdialog" aria-modal="true" aria-labelledby="errorTitle">
    <div class="error-overlay-inner">
      <i data-lucide="alert-triangle" style="width: 52px; height: 52px; color: var(--color-danger); margin-bottom: 1rem;" aria-hidden="true"></i>
      <h2 id="errorTitle" class="page-title" style="font-size:1.35rem;">Something went wrong</h2>
      <p id="errorMsg" class="text-muted" style="margin:1rem 0 1.5rem;"></p>
      <a href="/facilities.html" class="btn btn-primary">Back to facilities</a>
    </div>
  </div>

  <script src="/js/booking.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
