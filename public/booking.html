<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Facility - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html">My Bookings</a>
      <a href="#" id="navUser" aria-label="User profile" class="text-muted nav-user"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm">Logout</button>
    </nav>
  </header>

  <main class="page-content">
    <div class="container narrow-container">
      <a href="/facilities.html" class="link-back">
        <i class="icon-sm" data-lucide="arrow-left" aria-hidden="true"></i> Back to Facilities
      </a>

      <div id="bookingContent" class="booking-layout">
        <div class="booking-main">
          <div class="facility-header" id="facilityHeader">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-image skeleton-booking-image"></div>
          </div>

          <form class="is-hidden" id="bookingForm">
            <div class="form-group">
              <label for="bookDate"><i class="icon-xs-inline" data-lucide="calendar" aria-hidden="true"></i> Reservation date</label>
              <input class="form-control" type="date" id="bookDate" required>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="startTime"><i class="icon-xs-inline" data-lucide="clock" aria-hidden="true"></i> Start time</label>
                <input class="form-control" type="time" id="startTime" required>
              </div>
              <div class="form-group">
                <label for="endTime"><i class="icon-xs-inline" data-lucide="clock" aria-hidden="true"></i> End time</label>
                <input class="form-control" type="time" id="endTime" required>
              </div>
            </div>

            <div id="bookingTypeGroup" class="form-group is-hidden">
              <label><i class="icon-xs-inline" data-lucide="sun-moon" aria-hidden="true"></i> Booking type</label>
              <div class="checkbox-row booking-type-options">
                <label><input type="radio" name="bookingType" value="DAY" checked> Day</label>
                <label><input type="radio" name="bookingType" value="NIGHT"> Night</label>
              </div>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="quantity"><i class="icon-xs-inline" data-lucide="hash" aria-hidden="true"></i> Quantity</label>
                <input class="form-control" type="number" id="quantity" value="1" min="1" required>
              </div>
              <div class="form-group">
                <label for="guestCount"><i class="icon-xs-inline" data-lucide="users" aria-hidden="true"></i> Guest count</label>
                <input class="form-control" type="number" id="guestCount" value="1" min="1" required>
              </div>
            </div>

            <div class="form-group">
              <label for="notes"><i class="icon-xs-inline" data-lucide="message-square" aria-hidden="true"></i> Notes / special requests</label>
              <textarea class="form-textarea" id="notes" rows="3"></textarea>
            </div>

            <div class="is-hidden" id="availabilityStatus" role="status" aria-live="polite"></div>
          </form>
        </div>

        <aside class="booking-summary" aria-label="Booking summary">
          <h3 class="page-title booking-summary-title">Booking summary</h3>
          <div id="summaryDetails">
             <p class="text-muted">Fill in the details to see the total amount.</p>
          </div>
          <div class="promo-apply-panel">
            <label for="promoCodeInput">Promo code</label>
            <div class="promo-apply-row">
              <input id="promoCodeInput" class="form-control" type="text" placeholder="Enter promo code">
              <button type="button" id="applyPromoBtn" class="btn btn-secondary">Apply</button>
            </div>
            <div id="promoStatus" class="promo-status is-hidden" role="status" aria-live="polite"></div>
          </div>
          <hr class="summary-divider">
          <div class="summary-total-row">
            <span>Total amount</span>
            <span id="totalAmount">₱0.00</span>
          </div>
          <button type="button" id="submitBooking" class="btn btn-primary btn-block btn-large" disabled>Confirm reservation</button>
          <p class="input-hint booking-payment-note">You will have 15 minutes to complete payment after confirmation.</p>
        </aside>
      </div>
    </div>
  </main>

  <div id="errorOverlay" class="error-overlay" role="alertdialog" aria-modal="true" aria-labelledby="errorTitle">
    <div class="error-overlay-inner">
      <i class="icon-error-large" data-lucide="alert-triangle" aria-hidden="true"></i>
      <h2 id="errorTitle" class="page-title booking-error-title">Something went wrong</h2>
      <p id="errorMsg" class="text-muted booking-error-message"></p>
      <a href="/facilities.html" class="btn btn-primary">Back to facilities</a>
    </div>
  </div>

  <script src="/js/booking.js"></script>
  <script>
    lucide.createIcons();
  </script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
