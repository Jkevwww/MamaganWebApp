<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Ticket - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="ticket-page">
    <div class="container narrow-container">
      <div class="ticket-brand">
        <a href="/"><img src="/mamagan-logo.svg" alt="Mamagan Logo" height="56"></a>
      </div>

      <div class="ticket-card-shell">
        <div class="ticket-card-header">
          <h2>Booking Confirmation</h2>
          <p>Show this QR code upon arrival</p>
        </div>

        <div class="ticket-card-body">
          <div id="qr-container" class="ticket-qr-frame">
            <i data-lucide="qr-code" style="width:140px;height:140px;color:#334155;"></i>
          </div>

          <div class="ticket-kv-panel">
            <div class="ticket-kv-row">
              <span>Facility</span>
              <span id="ticketFacility">Loading...</span>
            </div>
            <div class="ticket-kv-row">
              <span>Date</span>
              <span id="ticketDate">Loading...</span>
            </div>
            <div class="ticket-kv-row">
              <span>Time</span>
              <span id="ticketTime">Loading...</span>
            </div>
            <div class="ticket-kv-row">
              <span>Booking ID</span>
              <span id="ticketID">#0000</span>
            </div>
          </div>
        </div>

        <div class="ticket-card-footer">
          <button type="button" onclick="window.print()" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:0.5rem;">
            <i data-lucide="printer" style="width:18px;"></i> Print Ticket
          </button>
          <a href="/my-bookings.html" class="text-muted" style="display:block;margin-top:1rem;text-align:center;font-size:0.92rem;">Back to My Bookings</a>
        </div>
      </div>

      <p class="ticket-footer-note">Thank you for choosing Mamagan Fun and Adventure Beach Resort!</p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    document.getElementById('ticketFacility').textContent = params.get('facility') || 'N/A';
    document.getElementById('ticketDate').textContent = params.get('date') || 'N/A';
    document.getElementById('ticketTime').textContent = params.get('time') || 'N/A';
    document.getElementById('ticketID').textContent = '#' + String(params.get('id') || '0000').padStart(4, '0');
  </script>
</body>
</html>
