<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Ticket - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar print-hidden">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html" class="auth-only is-hidden">My Bookings</a>
      <a href="#" id="navUser" aria-label="User profile" class="text-muted nav-user"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm is-hidden">Logout</button>
      <a href="/login.html" class="btn btn-primary btn-sm guest-only">Login</a>
    </nav>
  </header>

  <main class="page-content">
    <div class="ticket-page ticket-page--framed">
      <div class="container narrow-container">
        <div class="ticket-brand">
          <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo.svg" alt="Mamagan Logo" height="56"></a>
        </div>

        <div class="ticket-card-shell">
          <div class="ticket-card-header">
            <h2>Booking Confirmation</h2>
            <p>Show this QR code upon arrival</p>
          </div>

          <div class="ticket-card-body">
            <div id="qr-container" class="ticket-qr-frame">
              <i class="icon-ticket-qr" data-lucide="qr-code"></i>
            </div>

            <div class="ticket-kv-panel">
              <div class="ticket-kv-row">
                <span>Facility</span>
                <span id="ticketFacility">Loading...</span>
              </div>
              <div class="ticket-kv-row">
                <span>Date</span>
                <span id="ticketDate">Loading...</span>
              </div>
              <div class="ticket-kv-row">
                <span>Time</span>
                <span id="ticketTime">Loading...</span>
              </div>
              <div class="ticket-kv-row">
                <span>Booking ID</span>
                <span id="ticketID">#0000</span>
              </div>
            </div>
          </div>

          <div class="ticket-card-footer print-hidden">
            <button type="button" id="printTicketBtn" class="btn btn-primary inline-action">
              <i class="icon-md" data-lucide="printer"></i> Print Ticket
            </button>
            <a href="/my-bookings.html" class="text-muted ticket-back-link">Back to My Bookings</a>
          </div>
        </div>

        <p class="ticket-footer-note">Thank you for choosing Mamagan Fun and Adventure Beach Resort!</p>
      </div>
    </div>
  </main>

  <script>
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
          const user = await res.json();
          const navUser = document.getElementById('navUser');
          if (navUser) navUser.textContent = user.name || '';
          document.querySelectorAll('.auth-only').forEach(el => { el.classList.remove('is-hidden'); el.style.display = ''; });
          document.querySelectorAll('.guest-only').forEach(el => { el.style.display = 'none'; });
          const lo = document.getElementById('navLogout');
          if (lo) lo.style.display = 'inline-block';
        }
      } catch (_) {}
    }

    document.getElementById('navLogout')?.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (_) {}
      localStorage.clear();
      window.location.replace('/');
    });

    document.getElementById('printTicketBtn')?.addEventListener('click', () => window.print());

    const params = new URLSearchParams(window.location.search);
    document.getElementById('ticketFacility').textContent = params.get('facility') || 'N/A';
    document.getElementById('ticketDate').textContent = params.get('date') || 'N/A';
    document.getElementById('ticketTime').textContent = params.get('time') || 'N/A';
    document.getElementById('ticketID').textContent = '#' + String(params.get('id') || '0000').padStart(4, '0');

    (async () => {
      await checkAuth();
      lucide.createIcons();
    })();
  </script>
</body>
</html>
