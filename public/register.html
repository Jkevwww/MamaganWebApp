<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/google_oauth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page auth-page-bg">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center auth-logo-block">
        <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo.svg" alt="Mamagan Logo" height="50"></a>
      </div>

      <h1 class="auth-title">Create your Mamagan Account</h1>
      <p class="auth-subtitle subtitle">Book cottages, cabanas, and beach equipment online.</p>

      <div class="alert alert-error" id="alertBox"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name"><i class="icon-xs-inline" data-lucide="user"></i> Full Name</label>
          <input type="text" id="name" placeholder="Juan dela Cruz" required />
        </div>
        <div class="form-group">
          <label for="email"><i class="icon-xs-inline" data-lucide="mail"></i> Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="phone"><i class="icon-xs-inline" data-lucide="phone"></i> Phone Number</label>
          <input type="tel" id="phone" placeholder="09xx-xxx-xxxx" required />
        </div>
        <div class="form-group">
          <label for="password"><i class="icon-xs-inline" data-lucide="lock"></i> Password</label>
          <div class="input-wrapper password-field">
            <input type="password" id="password" placeholder="Min. 8 characters" required />
            <button class="password-toggle" type="button" data-target="password" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword"><i class="icon-xs-inline" data-lucide="shield-check"></i> Confirm Password</label>
          <div class="input-wrapper password-field">
            <input type="password" id="confirmPassword" placeholder="Confirm password" required />
            <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
      </form>

      <form id="verifyRegistrationForm" class="is-hidden" novalidate>
        <div class="verification-panel">
          <i class="icon-sm" data-lucide="mail-check" aria-hidden="true"></i>
          <div>
            <h2>Email verification</h2>
            <p>Enter the 6-digit code sent to <strong id="verificationEmailLabel"></strong>.</p>
          </div>
        </div>
        <div class="form-group">
          <label for="verificationCode"><i class="icon-xs-inline" data-lucide="shield-check"></i> Verification code</label>
          <input type="text" id="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="verifyBtn">Verify Email</button>
        <button type="button" class="btn btn-ghost btn-block" id="editRegistrationBtn">Edit registration details</button>
      </form>

      <p class="auth-switch-text auth-switch-text--spacious">
        Already have an account? <a class="auth-switch-link" href="/login.html">Login</a>
      </p>

      <div class="oauth-divider">
        <hr>
        <span>or</span>
        <hr>
      </div>

      <div class="oauth-stack">
        <a class="btn btn-google btn-block" href="/api/auth/google" id="googleRegisterBtn" aria-label="Continue with Google">
          <img class="oauth-provider-icon" src="/assets/images/google.svg" alt="" aria-hidden="true">
          Continue with Google
        </a>
        <a class="btn btn-github btn-block" href="/api/auth/github" id="githubRegisterBtn" aria-label="Continue with GitHub">
          <img class="oauth-provider-icon" src="/assets/images/github.svg" alt="" aria-hidden="true">
          Continue with GitHub
        </a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initPasswordToggles();
    lucide.createIcons();
    initRegisterForm('registerForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
