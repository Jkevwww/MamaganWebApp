<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background: #f8fafc;">

  <div class="container" style="max-width: 500px; padding-top: 5rem; text-align: center;">
    <div style="background: #fff; padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.05);">
      <div style="width: 80px; height: 80px; background: #fee2e2; color: #991b1b; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;">
        <i data-lucide="x-circle" style="width: 48px; height: 48px;"></i>
      </div>
      
      <h1 style="color: var(--error); margin-bottom: 1rem;">Payment Cancelled</h1>
      <p style="color: #64748b; margin-bottom: 2.5rem;">The payment process was cancelled. Your reservation is still pending but not yet confirmed.</p>

      <div style="display: flex; gap: 1rem; flex-direction: column;">
        <a id="retryBtn" href="#" class="btn btn-primary btn-block">Retry Payment</a>
        <a href="/my-bookings.html" class="btn btn-secondary btn-block">Back to My Bookings</a>
      </div>
    </div>
  </div>

  <script>
    const bookingId = new URLSearchParams(window.location.search).get('booking_id');
    
    if (bookingId) {
      document.getElementById('retryBtn').href = `/booking-details.html?id=${bookingId}`;
    } else {
      document.getElementById('retryBtn').href = '/my-bookings.html';
    }

    lucide.createIcons();
  </script>
</body>
</html>
