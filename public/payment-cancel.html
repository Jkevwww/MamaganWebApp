<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar print-hidden">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html" class="auth-only is-hidden">My Bookings</a>
      <a href="#" id="navUser" aria-label="User profile" class="text-muted nav-user"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm is-hidden">Logout</button>
      <a href="/login.html" class="btn btn-primary btn-sm guest-only">Login</a>
    </nav>
  </header>

  <main class="page-content">
    <div class="payment-result-page payment-result-page--framed">
      <div class="payment-result-inner result-inner-narrow">
        <div class="result-card">
          <div class="result-icon-circle result-icon-circle--danger">
            <i class="icon-result" data-lucide="x-circle"></i>
          </div>

          <h1 class="result-title-danger">Payment Cancelled</h1>
          <p class="text-muted result-copy">The payment process was cancelled. Your reservation is still pending but not yet confirmed.</p>

          <div class="stacked-actions">
            <a id="retryBtn" href="#" class="btn btn-primary btn-block">Retry Payment</a>
            <a href="/my-bookings.html" class="btn btn-secondary btn-block">Back to My Bookings</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get('booking_id') || params.get('bookingId') || params.get('id');
    let retryInFlight = false;

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (!res.ok) {
          return false;
        }

        const user = await res.json();
        const navUser = document.getElementById('navUser');
        if (navUser) navUser.textContent = user.name || '';
        document.querySelectorAll('.auth-only').forEach(el => { el.classList.remove('is-hidden'); el.style.display = ''; });
        document.querySelectorAll('.guest-only').forEach(el => { el.style.display = 'none'; });
        const lo = document.getElementById('navLogout');
        if (lo) lo.style.display = 'inline-block';
        return true;
      } catch (_) {
        return false;
      }
    }

    document.getElementById('navLogout')?.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (_) {}
      localStorage.clear();
      window.location.replace('/');
    });

    async function retryPayment(event) {
      event.preventDefault();
      if (retryInFlight) return;
      const btn = document.getElementById('retryBtn');
      if (!bookingId) {
        window.location.href = '/my-bookings.html';
        return;
      }

      retryInFlight = true;
      btn.textContent = 'Preparing Checkout...';
      btn.setAttribute('aria-disabled', 'true');
      btn.style.pointerEvents = 'none';

      try {
        const res = await fetch('/api/payments/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ bookingId })
        });

        if (res.status === 401 || res.status === 403) {
          const dest = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.replace(`/login.html?next=${dest}`);
          return;
        }

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Payment initiation failed');
        window.location.href = data.checkout_url;
      } catch (err) {
        alert('Error: ' + err.message);
        retryInFlight = false;
        btn.textContent = 'Retry Payment';
        btn.removeAttribute('aria-disabled');
        btn.style.pointerEvents = '';
      }
    }

    if (bookingId) {
      document.getElementById('retryBtn').href = `/booking-details.html?id=${encodeURIComponent(bookingId)}`;
      document.getElementById('retryBtn').addEventListener('click', retryPayment);
    } else {
      document.getElementById('retryBtn').href = '/my-bookings.html';
      document.getElementById('retryBtn').textContent = 'View My Bookings';
    }

    (async () => {
      const authed = await checkAuth();
      if (!authed) {
        const dest = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.replace(`/login.html?next=${dest}`);
        return;
      }
      window.lucide?.createIcons();
    })();
  </script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
