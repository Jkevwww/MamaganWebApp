<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="payment-result-page">
    <div class="payment-result-inner" style="max-width:500px;">
      <div class="result-card">
        <div class="result-icon-circle result-icon-circle--danger">
          <i data-lucide="x-circle" style="width:48px;height:48px;"></i>
        </div>

        <h1 style="color:var(--color-danger);margin-bottom:0.75rem;font-size:1.65rem;">Payment Cancelled</h1>
        <p class="text-muted" style="margin-bottom:2rem;">The payment process was cancelled. Your reservation is still pending but not yet confirmed.</p>

        <div style="display:flex;gap:0.75rem;flex-direction:column;">
          <a id="retryBtn" href="#" class="btn btn-primary btn-block">Retry Payment</a>
          <a href="/my-bookings.html" class="btn btn-secondary btn-block">Back to My Bookings</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bookingId = new URLSearchParams(window.location.search).get('booking_id');

    if (bookingId) {
      document.getElementById('retryBtn').href = `/booking-details.html?id=${encodeURIComponent(bookingId)}`;
    } else {
      document.getElementById('retryBtn').href = '/my-bookings.html';
    }

    lucide.createIcons();
  </script>
</body>
</html>
