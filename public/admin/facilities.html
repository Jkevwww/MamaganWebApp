<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Facilities - Mamagan Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">

  <header class="page-header">
    <h1 class="page-title">Facilities</h1>
    <p class="page-subtitle">Create, edit, and publish resort facilities and inventory.</p>
  </header>

  <div class="toolbar">
    <div class="search-filters toolbar-filters">
      <div class="search-field">
        <i data-lucide="search" aria-hidden="true"></i>
        <input type="text" id="facilitySearch" placeholder="Search facilities..." />
      </div>
      <select id="categoryFilter" class="form-select facility-category-filter" aria-label="Filter by category">
        <option value="">All Categories</option>
        <option value="COTTAGE">Cottages</option>
        <option value="CABANA">Cabanas</option>
        <option value="BEACH_EQUIPMENT">Equipment</option>
      </select>
    </div>
    <button type="button" class="btn btn-primary" id="addFacilityBtn">
      <i data-lucide="plus" aria-hidden="true"></i> Add Facility
    </button>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" id="facilitiesTable">
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price/Rate</th>
          <th>Inventory</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="facilitiesTbody">
        <!-- Loaded by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Facility Modal -->
  <div class="modal-overlay" id="facilityModal" role="presentation">
    <div class="modal modal-dialog facility-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Facility</h2>
        <button type="button" id="closeModal" class="modal-close" aria-label="Close dialog">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="facilityForm" class="facility-modal-form" enctype="multipart/form-data">
        <input type="hidden" id="facilityId">
        
        <div class="facility-form-grid">
          <!-- Basic Info -->
          <div>
            <div class="form-group">
              <label for="name">Facility Name <span class="label-required" aria-hidden="true">*</span></label>
              <input class="form-control" type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
              <label for="category">Category <span class="label-required" aria-hidden="true">*</span></label>
              <select class="form-select" id="category" name="category" required>
                <option value="COTTAGE">Cottage</option>
                <option value="CABANA">Cabana</option>
                <option value="BEACH_EQUIPMENT">Beach Equipment</option>
              </select>
            </div>
            <div class="form-group">
              <label for="size">Size/Type</label>
              <input class="form-control" type="text" id="size" name="size" placeholder="e.g. Small, Large, Standard">
            </div>
            <div class="form-group">
              <label for="description">Description</label>
              <textarea class="form-textarea" id="description" name="description" rows="4"></textarea>
            </div>
          </div>

          <!-- Pricing & Capacity -->
          <div>
            <div class="form-grid-2">
              <div class="form-group">
                <label for="inventory_count">Inventory (Units)</label>
                <input class="form-control" type="number" id="inventory_count" name="inventory_count" value="1" min="0" required>
              </div>
              <div class="form-group">
                <label for="rental_type">Rental Type</label>
                <select class="form-select" id="rental_type" name="rental_type" required>
                  <option value="FIXED">Fixed</option>
                  <option value="HOURLY">Hourly</option>
                  <option value="DAILY">Daily</option>
                </select>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label for="capacity_min">Min Pax</label>
                <input class="form-control" type="number" id="capacity_min" name="capacity_min" value="1" min="1">
              </div>
              <div class="form-group">
                <label for="capacity_max">Max Pax</label>
                <input class="form-control" type="number" id="capacity_max" name="capacity_max" value="1" min="1">
              </div>
            </div>

            <div id="rateFields">
               <div class="form-grid-2">
                 <div class="form-group">
                   <label for="day_rate_min">Day Rate Min (₱)</label>
                   <input class="form-control" type="number" id="day_rate_min" name="day_rate_min" value="0">
                 </div>
                 <div class="form-group">
                   <label for="day_rate_max">Day Rate Max (₱)</label>
                   <input class="form-control" type="number" id="day_rate_max" name="day_rate_max" value="0">
                 </div>
               </div>
               <div class="form-grid-2">
                 <div class="form-group">
                   <label for="night_surcharge_min">Night Surcharge Min (₱)</label>
                   <input class="form-control" type="number" id="night_surcharge_min" name="night_surcharge_min" value="0">
                 </div>
                 <div class="form-group">
                   <label for="night_surcharge_max">Night Surcharge Max (₱)</label>
                   <input class="form-control" type="number" id="night_surcharge_max" name="night_surcharge_max" value="0">
                 </div>
               </div>
               <div class="form-grid-2">
                 <div class="form-group">
                   <label for="hourly_rate">Hourly Rate (₱)</label>
                   <input class="form-control" type="number" id="hourly_rate" name="hourly_rate" value="0">
                 </div>
                 <div class="form-group">
                   <label for="daily_rate">Daily Rate (₱)</label>
                   <input class="form-control" type="number" id="daily_rate" name="daily_rate" value="0">
                 </div>
               </div>
            </div>
          </div>
        </div>

        <hr class="facility-modal-divider">

        <div class="facility-form-grid">
          <div>
            <div class="form-group">
              <label for="image_url">Image URL (Link)</label>
              <input class="form-control" type="text" id="image_url" name="image_url" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="image_file">Or Upload Image</label>
              <input class="form-control" type="file" id="image_file" name="image" accept="image/*">
            </div>
          </div>
          <div id="imagePreviewContainer" class="image-preview-box">
             <p class="text-muted">Image Preview</p>
             <img id="imagePreview" src="/mamagan-logo.svg" alt="Preview">
          </div>
        </div>

        <div class="checkbox-row">
           <label><input type="checkbox" id="active" name="active" checked value="1"> Active (Visible)</label>
           <label><input type="checkbox" id="bookable" name="bookable" checked value="1"> Bookable</label>
           <label><input type="checkbox" id="restricted_during_peak_hours" name="restricted_during_peak_hours" value="1"> Peak hour restricted</label>
        </div>

        <div class="form-group form-group-unavailable">
          <label for="unavailable_reason">Unavailable reason (if unbookable)</label>
          <input class="form-control" type="text" id="unavailable_reason" name="unavailable_reason">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Facility</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/skeleton.js"></script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/admin/js/facilities.js"></script>
</body>
</html>
