<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mamagan Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">

  <header class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Key metrics for Mamagan bookings and revenue.</p>
  </header>

  <div class="dashboard-stats-grid" id="dashboardStats">
    <div class="stat-card">
      <div class="skeleton skeleton-line-label"></div>
      <div class="skeleton skeleton-line-value"></div>
    </div>
    <div class="stat-card">
      <div class="skeleton skeleton-line-label"></div>
      <div class="skeleton skeleton-line-value"></div>
    </div>
    <div class="stat-card">
      <div class="skeleton skeleton-line-label"></div>
      <div class="skeleton skeleton-line-value"></div>
    </div>
    <div class="stat-card">
      <div class="skeleton skeleton-line-label"></div>
      <div class="skeleton skeleton-line-value"></div>
    </div>
  </div>

  <div class="charts-grid cols-2-1">
    <div class="chart-card">
      <h3>Monthly Revenue</h3>
      <div class="chart-canvas-wrap">
        <canvas id="revenueChart" height="240"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Booking Status</h3>
      <div class="chart-canvas-wrap">
        <canvas id="statusChart" height="240"></canvas>
      </div>
    </div>
  </div>

  <div class="charts-grid cols-2">
    <div class="chart-card">
      <h3>Facility Occupancy</h3>
      <div class="chart-canvas-wrap">
        <canvas id="occupancyChart" height="240"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Category Usage</h3>
      <div class="chart-canvas-wrap">
        <canvas id="categoryChart" height="240"></canvas>
      </div>
    </div>
  </div>

  <script src="/js/skeleton.js"></script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
