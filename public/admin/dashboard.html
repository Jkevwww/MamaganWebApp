<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mamagan Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">

  <div class="dashboard-stats-grid" id="dashboardStats">
    <!-- Stat cards with skeletons -->
    <div class="stat-card">
      <div class="skeleton" style="height: 12px; width: 50%; margin-bottom: 0.5rem;"></div>
      <div class="skeleton" style="height: 24px; width: 70%;"></div>
    </div>
    <div class="stat-card">
      <div class="skeleton" style="height: 12px; width: 50%; margin-bottom: 0.5rem;"></div>
      <div class="skeleton" style="height: 24px; width: 70%;"></div>
    </div>
    <div class="stat-card">
      <div class="skeleton" style="height: 12px; width: 50%; margin-bottom: 0.5rem;"></div>
      <div class="skeleton" style="height: 24px; width: 70%;"></div>
    </div>
    <div class="stat-card">
      <div class="skeleton" style="height: 12px; width: 50%; margin-bottom: 0.5rem;"></div>
      <div class="skeleton" style="height: 24px; width: 70%;"></div>
    </div>
  </div>

  <div class="charts-container" style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-top: 2rem;">
    <div class="chart-card" style="background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.05);">
       <h3 style="margin-bottom: 1.5rem;">Monthly Revenue</h3>
       <canvas id="revenueChart" height="250"></canvas>
    </div>
    <div class="chart-card" style="background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.05);">
       <h3 style="margin-bottom: 1.5rem;">Booking Status</h3>
       <canvas id="statusChart" height="250"></canvas>
    </div>
  </div>

  <div class="charts-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; margin-bottom: 3rem;">
    <div class="chart-card" style="background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.05);">
       <h3 style="margin-bottom: 1.5rem;">Facility Occupancy</h3>
       <canvas id="occupancyChart" height="250"></canvas>
    </div>
    <div class="chart-card" style="background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.05);">
       <h3 style="margin-bottom: 1.5rem;">Category Usage</h3>
       <canvas id="categoryChart" height="250"></canvas>
    </div>
  </div>

  <!-- Reusable layout and dashboard logic -->
  <script src="/js/skeleton.js"></script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
