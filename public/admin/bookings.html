<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings - Mamagan Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">

  <header class="page-header">
    <h1 class="page-title">Reservations</h1>
    <p class="page-subtitle">Review guest bookings, payment status, and visit schedule.</p>
  </header>

  <div class="table-toolbar">
    <label for="bookingStatusFilter" class="form-label">Filter by status</label>
    <select id="bookingStatusFilter" class="form-select">
      <option value="">All</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="cancelled">Cancelled</option>
    </select>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" id="adminBookingsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Facility</th>
            <th>Guest</th>
            <th>Date</th>
            <th>Time</th>
            <th>Qty / Pax</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="adminBookingsTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/skeleton.js"></script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/admin/js/bookings.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
