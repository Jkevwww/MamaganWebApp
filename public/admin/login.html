<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Mamagan</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <h1>Admin Panel</h1>
      <p class="subtitle">Sign in with your admin credentials</p>

      <div class="alert alert-error" id="alertBox"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@mamagan.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initAdminLoginForm('adminLoginForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
