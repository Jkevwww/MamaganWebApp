<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Mamagan Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">

  <header class="page-header">
    <h1 class="page-title">Reports</h1>
    <p class="page-subtitle">Export revenue, occupancy, and payment summaries from this area once reporting endpoints are connected.</p>
  </header>

  <section class="module-grid module-grid-wide" aria-label="Reports overview">
    <article class="module-card">
      <div class="module-card-header">
        <span class="module-icon"><i data-lucide="bar-chart-3"></i></span>
        <div>
          <h2>Revenue trends</h2>
          <p>Compare booking revenue across day, night, hourly, and daily rentals.</p>
        </div>
      </div>
      <div class="chart-preview" aria-label="Revenue chart preview">
        <span class="bar bar-sm"></span>
        <span class="bar bar-md"></span>
        <span class="bar bar-lg"></span>
        <span class="bar bar-xl"></span>
        <span class="bar bar-md"></span>
      </div>
    </article>

    <article class="module-card">
      <div class="module-card-header">
        <span class="module-icon module-icon-accent"><i data-lucide="download"></i></span>
        <div>
          <h2>Exports</h2>
          <p>Generate operational summaries for reservations, payments, and occupancy.</p>
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-block">Export report</button>
    </article>
  </section>

  <script src="/assets/js/admin-layout.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
