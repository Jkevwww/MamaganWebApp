<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in / QR - Mamagan Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">

  <header class="page-header">
    <h1 class="page-title">Check-in &amp; QR</h1>
    <p class="page-subtitle">Scan guest QR tickets and mark arrivals. Connect scanners or manual lookup when the check-in API is ready.</p>
  </header>

  <section class="module-grid" aria-label="Check-in tools">
    <article class="module-card scan-panel">
      <div class="module-card-header">
        <span class="module-icon"><i data-lucide="qr-code"></i></span>
        <div>
          <h2>QR scanner</h2>
          <p>Validate guest tickets and update arrival status.</p>
        </div>
      </div>
      <div class="qr-frame" aria-label="QR scanner preview">
        <i data-lucide="scan-line"></i>
      </div>
      <button type="button" class="btn btn-primary btn-block">Start scanner</button>
    </article>

    <article class="module-card">
      <div class="module-card-header">
        <span class="module-icon module-icon-accent"><i data-lucide="search"></i></span>
        <div>
          <h2>Manual lookup</h2>
          <p>Search by booking ID, guest name, or ticket code.</p>
        </div>
      </div>
      <div class="form-group">
        <label for="checkinSearch">Booking or guest</label>
        <input id="checkinSearch" type="search" class="form-control" placeholder="Search booking">
      </div>
    </article>
  </section>

  <script src="/assets/js/admin-layout.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
