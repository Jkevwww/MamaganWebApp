<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Details - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html">My Bookings</a>
      <a href="#" id="navUser" class="text-muted nav-user" aria-label="User profile"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm">Logout</button>
    </nav>
  </header>

  <main class="page-content">
    <div class="container narrow-container">
      <a href="/my-bookings.html" class="link-back">
        <i data-lucide="arrow-left" class="icon-small"></i> Back to My Bookings
      </a>

      <div id="detailsContent" class="booking-detail-card">
        <div class="booking-detail-body booking-loading">
          <div class="skeleton skeleton-title skeleton-title-center"></div>
          <div class="skeleton skeleton-chart skeleton-chart-spacing"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escAttr(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    function paymentStatusClass(ps) {
      return String(ps || '').toLowerCase() === 'paid' ? 'status-paid' : 'status-pending';
    }

    const bookingId = new URLSearchParams(window.location.search).get('id');

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (!res.ok) {
          const dest = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.replace(`/login.html?redirect=${dest}`);
          return false;
        }
        const user = await res.json();
        const navUserEl = document.getElementById('navUser');
        if (navUserEl && user?.name) navUserEl.textContent = user.name;
        return true;
      } catch (_) {
        window.location.replace('/login.html');
        return false;
      }
    }

    if (document.getElementById('navLogout')) {
      document.getElementById('navLogout').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } catch (_) {}
        localStorage.clear();
        window.location.replace('/');
      });
    }

    async function loadDetails() {
      if (!bookingId) {
        window.location.replace('/my-bookings.html');
        return;
      }

      try {
        const res = await fetch(`/api/facilities/bookings/${bookingId}`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error('Booking not found');
        const b = await res.json();

        renderDetails(b);
      } catch (err) {
        document.getElementById('detailsContent').innerHTML = `
          <div class="booking-detail-body empty-state-centered">
            <i data-lucide="alert-circle" class="icon-large icon-danger"></i>
            <h3>Error loading details</h3>
            <p class="text-muted">${escHtml(err.message)}</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function renderDetails(b) {
      const content = document.getElementById('detailsContent');
      const isPending = b.payment_status === 'pending' && b.status !== 'cancelled';
      const timeStart = b.start_time ? String(b.start_time).substring(0, 5) : '';
      const timeEnd = b.end_time ? String(b.end_time).substring(0, 5) : '';
      const expiresLine = b.expires_at
        ? `Please complete your payment before it expires at <strong>${escHtml(new Date(b.expires_at).toLocaleTimeString())}</strong>.`
        : 'Please complete your payment before it expires. Check your email for the deadline.';

      const thumb = b.image_url || 'https://placehold.co/100x100';
      const payClass = paymentStatusClass(b.payment_status);

      content.innerHTML = `
        <div class="booking-detail-hero">
          <div>
            <h2>Booking #${String(b.id).padStart(4, '0')}</h2>
            <p>Created on ${escHtml(new Date(b.created_at).toLocaleDateString())}</p>
          </div>
          <span class="booking-hero-badge">${escHtml(String(b.status || '').toUpperCase())}</span>
        </div>

        <div class="booking-detail-body">
          <div class="booking-detail-grid">
            <div>
              <h4 class="section-label">Facility Information</h4>
              <div class="facility-thumb-row">
                <img src="${escAttr(thumb)}" alt="">
                <div>
                  <div class="facility-title">${escHtml(b.facility_name)}</div>
                  <div class="text-muted facility-subtitle">${escHtml(b.category)} • ${b.quantity} unit(s)</div>
                </div>
              </div>
            </div>
            <div>
              <h4 class="section-label">Reservation Details</h4>
              <div>
                <div class="kv-row">
                  <span>Date</span>
                  <span>${escHtml(new Date(b.date).toLocaleDateString())}</span>
                </div>
                <div class="kv-row">
                  <span>Time</span>
                  <span>${escHtml(timeStart)} - ${escHtml(timeEnd)}</span>
                </div>
                <div class="kv-row">
                  <span>Guests</span>
                  <span>${b.guest_count} pax</span>
                </div>
              </div>
            </div>
          </div>

          <div class="payment-summary-panel">
            <h4>Payment Summary</h4>
            <div class="payment-summary-row">
              <div>
                <div class="text-muted facility-subtitle">Total Amount</div>
                <div class="facility-title">₱${Number(b.total_amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</div>
              </div>
              <div class="payment-status-block">
                <div class="text-muted facility-subtitle">Payment Status</div>
                <span class="status-badge ${payClass} payment-status-badge">${escHtml(String(b.payment_status || '').toUpperCase())}</span>
              </div>
            </div>
            ${isPending ? `
              <div class="payment-alert">
                <i class="payment-alert-icon" data-lucide="clock"></i>
                <div>
                  <strong>Action Required:</strong> ${expiresLine}
                </div>
              </div>
            ` : ''}
          </div>

          <div class="booking-actions-row">
            ${isPending ? `
              <button type="button" id="payNowBtn" class="btn btn-primary inline-action">
                <i data-lucide="credit-card"></i> Pay Now via GCash
              </button>
            ` : ''}
            ${b.payment_status === 'paid' ? `
              <a href="/view-ticket.html?id=${encodeURIComponent(b.id)}&facility=${encodeURIComponent(b.facility_name)}&date=${encodeURIComponent(new Date(b.date).toLocaleDateString())}&time=${encodeURIComponent(timeStart + ' - ' + timeEnd)}" class="btn btn-primary inline-action">
                <i data-lucide="qr-code"></i> View Digital Ticket
              </a>
            ` : ''}
            ${b.status === 'pending' || b.status === 'approved' ? `
              <button type="button" id="cancelBookingBtn" class="btn btn-secondary text-danger-action">Cancel Reservation</button>
            ` : ''}
          </div>
        </div>
      `;
      lucide.createIcons();

      document.getElementById('payNowBtn')?.addEventListener('click', () => initiatePayment(b.id));
      document.getElementById('cancelBookingBtn')?.addEventListener('click', () => cancelBooking(b.id));
    }

    async function initiatePayment(id) {
      const btn = document.getElementById('payNowBtn');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = 'Preparing Checkout...';

      try {
        const res = await fetch('/api/payments/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ bookingId: id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Payment initiation failed');

        window.location.href = data.checkout_url;
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Pay Now via GCash';
      }
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this reservation?')) return;

      try {
        const res = await fetch(`/api/facilities/bookings/${id}/cancel`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin'
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to cancel booking');
        alert('Reservation cancelled successfully.');
        window.location.reload();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    (async function init() {
      if (!await checkAuth()) return;
      await loadDetails();
    })();
    lucide.createIcons();
  </script>
</body>
</html>
