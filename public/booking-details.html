<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Details - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html">My Bookings</a>
      <a href="#" id="navUser" style="opacity:.7; cursor:default;"></a>
      <button id="navLogout" class="btn btn-secondary" style="padding: 0.4rem 1rem; margin-left: 1rem;">Logout</button>
    </nav>
  </header>

  <main class="page-content">
    <div class="container" style="max-width: 800px;">
      <a href="/my-bookings.html" style="display: flex; align-items: center; gap: 0.5rem; color: #64748b; margin-bottom: 2rem; font-size: 0.9rem;">
        <i data-lucide="arrow-left" style="width: 16px;"></i> Back to My Bookings
      </a>

      <div id="detailsContent" style="background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.08);">
        <!-- Content loaded by JS -->
        <div style="padding: 4rem; text-align: center;">
          <div class="skeleton" style="height: 40px; width: 40%; margin: 0 auto 1rem;"></div>
          <div class="skeleton" style="height: 200px; width: 100%;"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const bookingId = new URLSearchParams(window.location.search).get('id');

    async function loadDetails() {
      if (!bookingId) {
        window.location.replace('/my-bookings.html');
        return;
      }

      try {
        const res = await fetch(`/api/facilities/bookings/${bookingId}`);
        if (!res.ok) throw new Error('Booking not found');
        const b = await res.json();
        
        renderDetails(b);
      } catch (err) {
        document.getElementById('detailsContent').innerHTML = `
          <div style="padding: 4rem; text-align: center; color: var(--error);">
            <i data-lucide="alert-circle" style="width: 48px; height: 48px; margin-bottom: 1rem;"></i>
            <h3>Error loading details</h3>
            <p>${err.message}</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function renderDetails(b) {
      const content = document.getElementById('detailsContent');
      const isPending = b.payment_status === 'pending' && b.status !== 'cancelled';
      
      content.innerHTML = `
        <div style="background: var(--primary); color: #fff; padding: 2rem; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h2 style="margin: 0; font-size: 1.8rem;">Booking #${b.id.toString().padStart(4, '0')}</h2>
            <p style="margin: 0.5rem 0 0; opacity: 0.9;">Created on ${new Date(b.created_at).toLocaleDateString()}</p>
          </div>
          <span class="badge" style="background: rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 1rem; font-size: 1rem; border: 1px solid rgba(255,255,255,0.3);">
            ${b.status.toUpperCase()}
          </span>
        </div>

        <div style="padding: 2rem;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
            <div>
              <h4 style="text-transform: uppercase; font-size: 0.75rem; color: #64748b; letter-spacing: 1px; margin-bottom: 1rem;">Facility Information</h4>
              <div style="display: flex; gap: 1rem; align-items: center;">
                <img src="${b.image_url || 'https://placehold.co/100x100'}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
                <div>
                  <div style="font-weight: 700; font-size: 1.1rem; color: var(--primary);">${b.facility_name}</div>
                  <div style="font-size: 0.85rem; color: #64748b;">${b.category} • ${b.quantity} unit(s)</div>
                </div>
              </div>
            </div>
            <div>
              <h4 style="text-transform: uppercase; font-size: 0.75rem; color: #64748b; letter-spacing: 1px; margin-bottom: 1rem;">Reservation Details</h4>
              <div style="line-height: 1.8;">
                <div style="display: flex; justify-content: space-between;">
                   <span style="color: #64748b;">Date:</span>
                   <span style="font-weight: 600;">${new Date(b.date).toLocaleDateString()}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                   <span style="color: #64748b;">Time:</span>
                   <span style="font-weight: 600;">${b.start_time.substring(0,5)} - ${b.end_time.substring(0,5)}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                   <span style="color: #64748b;">Guests:</span>
                   <span style="font-weight: 600;">${b.guest_count} pax</span>
                </div>
              </div>
            </div>
          </div>

          <div style="background: #f8fafc; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;">
            <h4 style="margin-bottom: 1rem;">Payment Summary</h4>
            <div style="display: flex; justify-content: space-between; align-items: center;">
               <div>
                 <div style="font-size: 0.85rem; color: #64748b;">Total Amount</div>
                 <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">₱${Number(b.total_amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
               </div>
               <div style="text-align: right;">
                 <div style="font-size: 0.85rem; color: #64748b;">Payment Status</div>
                 <span class="badge ${b.payment_status === 'paid' ? 'status-approved' : 'status-pending'}" style="margin-top: 0.3rem;">
                   ${b.payment_status.toUpperCase()}
                 </span>
               </div>
            </div>
            ${isPending ? `
              <div style="margin-top: 1.5rem; padding: 1rem; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; font-size: 0.85rem; color: #92400e; display: flex; gap: 0.8rem;">
                <i data-lucide="clock" style="width: 18px; flex-shrink: 0;"></i>
                <div>
                  <strong>Action Required:</strong> Please complete your payment before it expires at <strong>${new Date(b.expires_at).toLocaleTimeString()}</strong>.
                </div>
              </div>
            ` : ''}
          </div>

          <div style="display: flex; gap: 1rem; justify-content: center;">
            ${isPending ? `
              <button class="btn btn-primary" style="padding: 0.8rem 2rem;">Pay Now via GCash</button>
            ` : ''}
            ${b.payment_status === 'paid' ? `
              <a href="/view-ticket.html?id=${b.id}&facility=${encodeURIComponent(b.facility_name)}&date=${encodeURIComponent(new Date(b.date).toLocaleDateString())}&time=${encodeURIComponent(b.start_time.substring(0,5) + ' - ' + b.end_time.substring(0,5))}" class="btn btn-primary" style="padding: 0.8rem 2rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="qr-code"></i> View Digital Ticket
              </a>
            ` : ''}
            ${b.status === 'pending' || b.status === 'approved' ? `
              <button onclick="cancelBooking(${b.id})" class="btn btn-secondary" style="color: var(--error); border-color: var(--error); padding: 0.8rem 2rem;">Cancel Reservation</button>
            ` : ''}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this reservation?')) return;
      
      try {
        const res = await fetch(`/api/facilities/bookings/${id}/cancel`, {
           method: 'PATCH',
           headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to cancel booking');
        alert('Reservation cancelled successfully.');
        window.location.reload();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Init
    loadDetails();
  </script>
</body>
</html>
