<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facility Details - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html" class="auth-only is-hidden">My Bookings</a>
      <a href="#" id="navUser" aria-label="User profile" class="text-muted nav-user"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm is-hidden">Logout</button>
      <a href="/login.html" class="btn btn-primary btn-sm guest-only">Login</a>
    </nav>
  </header>

  <main class="page-content">
    <div class="container narrow-container">
      <a href="/facilities.html" class="link-back">
        <i class="icon-sm" data-lucide="arrow-left" aria-hidden="true"></i> Back to Facilities
      </a>

      <div id="facilityDetails" class="facility-detail-layout">
        <div class="facility-detail-media">
          <div class="skeleton skeleton-image skeleton-facility-image"></div>
        </div>
        <div>
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text skeleton-text-90"></div>
          <div class="skeleton skeleton-text skeleton-text-72"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escAttr(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    const facilityId = new URLSearchParams(window.location.search).get('id');

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
          const user = await res.json();
          const navUser = document.getElementById('navUser');
          if (navUser) navUser.textContent = user.name || '';
          document.querySelectorAll('.auth-only').forEach(el => { el.classList.remove('is-hidden'); el.style.display = ''; });
          document.querySelectorAll('.guest-only').forEach(el => { el.style.display = 'none'; });
          const logoutBtn = document.getElementById('navLogout');
          if (logoutBtn) logoutBtn.style.display = 'inline-block';
        }
      } catch (_) {}
    }

    if (document.getElementById('navLogout')) {
      document.getElementById('navLogout').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } catch (_) {}
        localStorage.clear();
        window.location.replace('/');
      });
    }

    async function loadFacility() {
      if (!facilityId) { window.location.replace('/facilities.html'); return; }

      try {
        const res = await fetch(`/api/facilities/${facilityId}`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error('Facility not found');
        const f = await res.json();

        renderFacility(f);
      } catch (err) {
        document.getElementById('facilityDetails').innerHTML =
          `<p class="inline-error">${escHtml(err.message)}</p>`;
      }
    }

    function renderFacility(f) {
      const container = document.getElementById('facilityDetails');
      const imgSrc = f.image_url || 'https://placehold.co/600x400';
      const rentalLabel = f.category === 'BEACH_EQUIPMENT'
        ? (f.rental_type === 'DAILY' ? 'day' : f.rental_type === 'HOURLY' ? 'hour' : 'hour / day')
        : f.category === 'CABANA' ? 'day' : 'session';
      const rateMin = f.category === 'BEACH_EQUIPMENT' ? f.hourly_rate : f.category === 'CABANA' ? f.day_rate_min : f.price_min;
      const rateMax = f.category === 'BEACH_EQUIPMENT' ? f.daily_rate : f.category === 'CABANA' ? f.day_rate_max : f.price_max;
      const priceRange = Number(rateMax) > Number(rateMin)
        ? `₱${Number(rateMin).toLocaleString()} - ₱${Number(rateMax).toLocaleString()}`
        : `₱${Number(rateMin || 0).toLocaleString()}`;

      container.innerHTML = `
        <div class="facility-detail-media">
          <img src="${escAttr(imgSrc)}" alt="${escAttr(f.name)}">
        </div>
        <div class="facility-info">
          <h1 class="facility-detail-title">${escHtml(f.name)}</h1>
          <div class="facility-meta-row">
            <span class="badge badge-muted">${escHtml(f.size)}</span>
            ${f.capacity_max ? `<span class="badge badge-warm">${f.capacity_min || 1}-${f.capacity_max} pax</span>` : ''}
            <span class="badge badge-info">${escHtml(f.category)}</span>
          </div>

          <p class="facility-description">${escHtml(f.description)}</p>

          <div class="pricing-panel">
            <div class="pricing-panel-label">Pricing</div>
            <div class="pricing-panel-value">
              ${priceRange}
              <small> / ${rentalLabel}</small>
            </div>
            ${f.category === 'CABANA' ? '<p class="facility-rate-note">* Night surcharge applies for overnight stays.</p>' : ''}
          </div>

          ${f.is_bookable || f.bookable ? `
            <a href="/booking.html?id=${encodeURIComponent(f.id)}" class="btn btn-primary btn-block btn-large">Book this Facility</a>
          ` : `
            <div class="unavailable-panel">
              <i class="icon-info-centered" data-lucide="info"></i>
              <p><strong>Currently Unavailable</strong></p>
              <p class="facility-unavailable-note">${escHtml(f.unavailable_reason || 'This facility is not open for reservations at the moment.')}</p>
            </div>
          `}

          <div class="facility-rules">
            <h4>Facility Rules</h4>
            <ul>
              ${f.capacity_max ? `<li><i class="icon-xs-primary" data-lucide="check-circle"></i> Maximum capacity of ${f.capacity_max} people must be strictly followed.</li>` : ''}
              <li><i class="icon-xs-primary" data-lucide="check-circle"></i> No loud music after 10:00 PM.</li>
              <li><i class="icon-xs-primary" data-lucide="check-circle"></i> Please keep the area clean.</li>
            </ul>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    checkAuth();
    loadFacility();
    lucide.createIcons();
  </script>
</body>
</html>
