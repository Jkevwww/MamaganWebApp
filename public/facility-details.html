<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facility Details - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="/"><img src="/mamagan-logo-white.svg" alt="Mamagan Logo" height="40"></a>
    </div>
    <nav>
      <a href="/facilities.html">Facilities</a>
      <a href="/my-bookings.html" class="auth-only" style="display:none;">My Bookings</a>
      <a href="#" id="navUser" class="text-muted" style="opacity:0.85;cursor:default;max-width:180px;overflow:hidden;text-overflow:ellipsis;"></a>
      <button type="button" id="navLogout" class="btn btn-secondary btn-sm" style="display:none;">Logout</button>
      <a href="/login.html" class="btn btn-primary btn-sm guest-only">Login</a>
    </nav>
  </header>

  <main class="page-content">
    <div class="container narrow-container">
      <a href="/facilities.html" class="link-back">
        <i data-lucide="arrow-left" style="width: 16px;" aria-hidden="true"></i> Back to Facilities
      </a>

      <div id="facilityDetails" class="facility-detail-layout">
        <div class="facility-detail-media">
          <div class="skeleton skeleton-image" style="height:320px;border-radius:var(--radius-lg);"></div>
        </div>
        <div>
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text" style="width:90%;"></div>
          <div class="skeleton skeleton-text" style="width:72%;"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escAttr(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    const facilityId = new URLSearchParams(window.location.search).get('id');

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
          const user = await res.json();
          const navUser = document.getElementById('navUser');
          if (navUser) navUser.textContent = user.name || '';
          document.querySelectorAll('.auth-only').forEach(el => { el.style.display = ''; });
          document.querySelectorAll('.guest-only').forEach(el => { el.style.display = 'none'; });
          const logoutBtn = document.getElementById('navLogout');
          if (logoutBtn) logoutBtn.style.display = 'inline-block';
        }
      } catch (_) {}
    }

    if (document.getElementById('navLogout')) {
      document.getElementById('navLogout').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } catch (_) {}
        localStorage.clear();
        window.location.replace('/');
      });
    }

    async function loadFacility() {
      if (!facilityId) { window.location.replace('/facilities.html'); return; }

      try {
        const res = await fetch(`/api/facilities/${facilityId}`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error('Facility not found');
        const f = await res.json();

        renderFacility(f);
      } catch (err) {
        document.getElementById('facilityDetails').innerHTML =
          `<p style="grid-column:1/-1;color:var(--color-danger);">${escHtml(err.message)}</p>`;
      }
    }

    function renderFacility(f) {
      const container = document.getElementById('facilityDetails');
      const imgSrc = f.image_url || 'https://placehold.co/600x400';
      const rentalLabel = f.rental_type === 'DAILY' ? 'day' : f.rental_type === 'HOURLY' ? 'hour' : 'session';
      const priceRange = f.price_max > f.price_min
        ? `₱${Number(f.price_min).toLocaleString()} - ₱${Number(f.price_max).toLocaleString()}`
        : `₱${Number(f.price_min).toLocaleString()}`;

      container.innerHTML = `
        <div class="facility-detail-media">
          <img src="${escAttr(imgSrc)}" alt="${escAttr(f.name)}">
        </div>
        <div class="facility-info">
          <h1 class="facility-detail-title">${escHtml(f.name)}</h1>
          <div class="facility-meta-row">
            <span class="badge" style="background:#f1f5f9;color:#64748b;">${escHtml(f.size)}</span>
            <span class="badge" style="background:#fff7ed;color:#9a3412;">${f.capacity_min}-${f.capacity_max} pax</span>
            <span class="badge" style="background:#f0f9ff;color:#0369a1;">${escHtml(f.category)}</span>
          </div>

          <p class="facility-description">${escHtml(f.description)}</p>

          <div class="pricing-panel">
            <div class="pricing-panel-label">Pricing</div>
            <div class="pricing-panel-value">
              ${priceRange}
              <small> / ${rentalLabel}</small>
            </div>
            ${f.category === 'Room' ? '<p style="font-size: 0.85rem; color: var(--color-muted); margin-top: 0.5rem;">* Night surcharge applies for overnight stays.</p>' : ''}
          </div>

          ${f.is_bookable ? `
            <a href="/booking.html?id=${encodeURIComponent(f.id)}" class="btn btn-primary btn-block btn-large">Book this Facility</a>
          ` : `
            <div class="unavailable-panel">
              <i data-lucide="info" style="width:22px;height:22px;margin:0 auto 0.5rem;display:block;"></i>
              <p><strong>Currently Unavailable</strong></p>
              <p style="font-size: 0.9rem; opacity: 0.9; margin-top: 0.35rem;">${escHtml(f.unavailable_reason || 'This facility is not open for reservations at the moment.')}</p>
            </div>
          `}

          <div class="facility-rules">
            <h4>Facility Rules</h4>
            <ul>
              <li><i data-lucide="check-circle" style="width:14px;color:var(--color-primary);flex-shrink:0;"></i> Maximum capacity of ${f.capacity_max} people must be strictly followed.</li>
              <li><i data-lucide="check-circle" style="width:14px;color:var(--color-primary);flex-shrink:0;"></i> No loud music after 10:00 PM.</li>
              <li><i data-lucide="check-circle" style="width:14px;color:var(--color-primary);flex-shrink:0;"></i> Please keep the area clean.</li>
            </ul>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    checkAuth();
    loadFacility();
    lucide.createIcons();
  </script>
</body>
</html>
