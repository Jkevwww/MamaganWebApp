<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mamagan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/google_oauth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background: linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);">
  <div class="auth-wrapper" style="min-height: 100vh;">
    <div class="auth-card">
      <div class="text-center" style="margin-bottom: 2rem;">
        <a href="/"><img src="/mamagan-logo.svg" alt="Mamagan Logo" height="50"></a>
      </div>
      
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your Mamagan account</p>

      <div class="alert alert-error" id="alertBox"></div>

      <div style="margin-bottom: 1.5rem;">
        <a class="btn btn-google btn-block" href="/api/auth/google" id="googleLoginBtn" style="display: flex; align-items: center; justify-content: center; gap: 0.8rem; border: 1px solid #ddd; background: #fff; color: #555;">
          <img width="18" height="18" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" alt="Google">
          Continue with Google
        </a>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
        <hr style="flex: 1; border: 0; border-top: 1px solid #eee;">
        <span style="font-size: 0.8rem; color: #999; text-transform: uppercase;">or email</span>
        <hr style="flex: 1; border: 0; border-top: 1px solid #eee;">
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email"><i data-lucide="mail" style="width:14px; margin-right:5px;"></i> Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password"><i data-lucide="lock" style="width:14px; margin-right:5px;"></i> Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:.9rem; color:#777;">
        Don't have an account? <a href="/register.html" style="color:var(--primary); font-weight: 600;">Register</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();
    initLoginForm('loginForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
