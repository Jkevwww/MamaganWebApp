<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamagan Resort Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/google_oauth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page-bg">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center" style="margin-bottom: 2rem;">
        <a href="/"><img src="/mamagan-logo.svg" alt="Mamagan Logo" height="50"></a>
      </div>

      <h1>Mamagan Resort Login</h1>
      <p class="subtitle">Sign in with one account for bookings or staff access.</p>

      <div class="alert alert-error" id="alertBox"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email"><i data-lucide="mail" style="width:14px; margin-right:5px;"></i> Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password"><i data-lucide="lock" style="width:14px; margin-right:5px;"></i> Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Login</button>
      </form>

      <p style="text-align:center; margin-top:1rem; font-size:.85rem; color:#777;">
        Admin and staff accounts will be redirected automatically to the admin dashboard.
      </p>

      <p style="text-align:center; margin-top:1.25rem; font-size:.9rem; color:#777;">
        Need a tourist account? <a href="/register.html" style="color:var(--primary); font-weight: 600;">Register</a>
      </p>

      <div class="oauth-divider">
        <hr>
        <span>or</span>
        <hr>
      </div>

      <div class="oauth-stack">
        <a class="btn btn-google btn-block" href="/api/auth/google" id="googleLoginBtn" aria-label="Continue with Google">
          <img width="18" height="18" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" alt="">
          Continue with Google
        </a>
        <a class="btn btn-github btn-block" href="/api/auth/github" id="githubLoginBtn" aria-label="Continue with GitHub">
          Continue with GitHub
        </a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();
    initLoginForm('loginForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
