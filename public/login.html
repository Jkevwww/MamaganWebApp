<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Mamagan</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your Mamagan account</p>

      <div class="alert alert-error" id="alertBox"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:1.2rem; font-size:.9rem; color:#777;">
        Don't have an account? <a href="/register.html" style="color:#1a73e8;">Register</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initLoginForm('loginForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
