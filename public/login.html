<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Mamagan</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/google_oauth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your Mamagan account</p>

      <div class="alert alert-error" id="alertBox"></div>

      <div style="margin: 0 0 1rem 0;">
        <a class="btn btn-google" href="/api/auth/google" id="googleLoginBtn" aria-label="Continue with Google">
          <img class="google-g-icon" src="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2718%27%20height%3D%2718%27%20viewBox%3D%270%200%2018%2018%27%3E%3Cpath%20fill%3D%27%234285F4%27%20d%3D%27M17.64%208.18%20v-1.3H%2017%20H9%20v2.98h5.25c-.22%201.18-.88%202.18-1.88%202.85v2%20h3.05c1.78-1.64%202.22-4.06%202.22-7.53Z%27/%3E%3Cpath%20fill%3D%27%23141414%27%20d%3D%27M9%2017c2.43%200%204.47-.8%205.96-2.17l-3.05-2c-.85.58-1.98.92-2.91.92-2.34%200-4.31-1.58-5.02-3.7H.85v2.07A8.998%208.998%200%200%2017Z%27/%3E%3Cpath%20fill%3D%27%23FBBC05%27%20d%3D%27M3.98%209.05%202.85%206.98%200%2010.02l.85%202.07c.55%201.72%201.7%203.18%203.43%204.33V12.35c-.28-.92-.28-1.92%200-2.88Z%27/%3E%3Cpath%20fill%3D%27%2334A853%27%20d%3D%27M9%200c1.32%200%202.5.45%203.44%201.33l2.33-2.33C13.47%200.2%2011.43%20-.6%209-.6%204.08%20-.6%200.7%202.12.15%204.22l3.83%203.8C4.69%202.2%206.66%200%209%200Z%27/%3E%3C/svg%3E" alt="" />
          Continue with Google
        </a>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:1.2rem; font-size:.9rem; color:#777;">
        Don't have an account? <a href="/register.html" style="color:#1a73e8;">Register</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initLoginForm('loginForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
