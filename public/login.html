<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamagan Resort Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/google_oauth.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page auth-page-bg">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center auth-logo-block">
        <a href="/" aria-label="Mamagan home"><img src="/mamagan-logo.svg" alt="Mamagan Logo" height="50"></a>
      </div>

      <h1 class="auth-title">Mamagan Resort Login</h1>
      <p class="auth-subtitle subtitle">Sign in with one account for bookings or staff access.</p>

      <div class="alert alert-error" id="alertBox"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email"><i class="icon-xs-inline" data-lucide="mail"></i> Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password"><i class="icon-xs-inline" data-lucide="lock"></i> Password</label>
          <div class="input-wrapper password-field">
            <input type="password" id="password" placeholder="Password" required>
            <button class="password-toggle" type="button" data-target="password" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Login</button>
      </form>

      <p class="auth-helper-text">
        Admin and staff accounts will be redirected automatically to the admin dashboard.
      </p>

      <p class="auth-switch-text">
        Need a tourist account? <a class="auth-switch-link" href="/register.html">Register</a>
      </p>

      <div class="oauth-divider">
        <hr>
        <span>or</span>
        <hr>
      </div>

      <div class="oauth-stack">
        <a class="btn btn-google btn-block" href="/api/auth/google" id="googleLoginBtn" aria-label="Continue with Google">
          <img class="oauth-provider-icon" src="/assets/images/google.svg" alt="" aria-hidden="true">
          Continue with Google
        </a>
        <a class="btn btn-github btn-block" href="/api/auth/github" id="githubLoginBtn" aria-label="Continue with GitHub">
          <img class="oauth-provider-icon" src="/assets/images/github.svg" alt="" aria-hidden="true">
          Continue with GitHub
        </a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    initPasswordToggles();
    lucide.createIcons();
    initLoginForm('loginForm', 'alertBox', 'submitBtn');
  </script>
</body>
</html>
